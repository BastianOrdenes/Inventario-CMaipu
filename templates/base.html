{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Comercial Maipú{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<!-- Agregamos Flexbox vertical y alto mínimo de pantalla (min-vh-100) -->
<body class="d-flex flex-column min-vh-100">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'inicio' %}">
                {% if request.resolver_match.url_name != 'inicio' %}
                    <img src="{% static 'logo_empresa.jpg' %}" alt="Logo Comercial Maipú" height="35" class="d-inline-block align-text-top me-2">
                {% endif %}
                Comercial Maipú
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'inicio' %}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'muebles' %}">Inventario Muebles</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'nosotros' %}">Nosotros</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal (flex-grow-1 empuja el footer hacia abajo) -->
    <main class="container my-4 flex-grow-1">
        {% block contenido %}
        {% endblock %}
    </main>

    <!-- Footer Pegado al Fondo -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Comercial Maipú - Proyecto Inacap</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
